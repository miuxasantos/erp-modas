spring:
  application:
    name: erp-modas
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          format_sql: true

security:
  jwt:
    secret: ${SECURITY_KEY}
    expiration-hours: ${SECURITY_KEY_HOURS}

server:
  servlet:
    context-path: /api