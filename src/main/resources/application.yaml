spring:
  application:
    name: erp-modas
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

security:
  jwt:
    secret: ${SECURITY_KEY}
    expiration-hours: ${SECURITY_KEY_HOURS}

server:
  servlet:
    context-path: /api

app:
  storage:
    dir: /uploads
    tamanho-max: 10MB
    largura-full: 1200
    largura-thumb: 300
    qualidade: 0.85
    limpeza-cron: 0 0 3 * * SUN